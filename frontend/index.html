<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoDemo SaaS — Connexion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">⚡</span>
      <h1>AutoDemo</h1>
      <p>Générateur de sites démo pour vos prospects</p>
    </div>

    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label for="email">Adresse email</label>
        <input type="email" id="email" placeholder="vous@exemple.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="name">Nom (première connexion uniquement)</label>
        <input type="text" id="name" placeholder="Votre nom ou entreprise" autocomplete="name" />
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
        <span class="btn-text">Se connecter / Créer un compte</span>
        <span class="btn-loader hidden">⏳</span>
      </button>
      <p id="loginError" class="form-error hidden"></p>
    </form>

    <p class="auth-note">
      Si votre email existe déjà, vous serez connecté directement.<br />
      Sinon, un compte sera créé avec <strong>10 crédits offerts</strong>.
    </p>
  </div>

  <script>
    const API_BASE = window.API_BASE || 'http://localhost:3000';

    // Redirect if already logged in
    const existingUserId = localStorage.getItem('userId');
    if (existingUserId) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const name  = document.getElementById('name').value.trim();
      const btn   = document.getElementById('loginBtn');
      const error = document.getElementById('loginError');

      btn.disabled = true;
      btn.querySelector('.btn-text').classList.add('hidden');
      btn.querySelector('.btn-loader').classList.remove('hidden');
      error.classList.add('hidden');

      try {
        // Try creating account (409 = already exists, that's fine)
        const res = await fetch(`${API_BASE}/users`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, name: name || email.split('@')[0] }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('userId', data.data.id);
          localStorage.setItem('userEmail', email);
          window.location.href = 'dashboard.html';
          return;
        }

        if (res.status === 409) {
          // Account exists — we need the user ID from backend
          // In a real app, use a proper auth flow. Here we store email and
          // ask backend to look up by email via a GET endpoint (not in current spec).
          // Workaround: store email and re-use stored userId if present.
          error.textContent = "Compte existant. Entrez votre userId dans la console ou rechargez après avoir créé un compte.";
          error.classList.remove('hidden');
          return;
        }

        error.textContent = data.error || 'Erreur lors de la connexion.';
        error.classList.remove('hidden');
      } catch (err) {
        error.textContent = 'Impossible de contacter le serveur. Vérifiez que le backend tourne.';
        error.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.querySelector('.btn-text').classList.remove('hidden');
        btn.querySelector('.btn-loader').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
