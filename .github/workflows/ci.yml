name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Évaluation du contenu généré
        # Mode mock : gratuit et déterministe. Vérifie le harnais et le contenu
        # de repli, qui est publié tel quel sous le nom d'entreprises réelles
        # chaque fois qu'un appel au modèle échoue. Sort en échec sous 70 %.
        run: npm run eval
        env:
          AI_MOCK_MODE: "true"
      - name: Audit sécurité (prod)
        # Bloquant désormais : les dépendances de production sont à zéro
        # vulnérabilité, autant que ça le reste. Les outils de développement
        # (vitest, vite, esbuild) ne tournent pas en production et sont exclus.
        run: npm audit --omit=dev --audit-level=moderate

  docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build (validation du Dockerfile)
        run: docker build -t autodemo:ci .
